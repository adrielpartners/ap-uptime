# Adriel Partners uptime check — GitHub Actions workflow
# Source: AP-BUILD-INSTRUCTIONS / templates/ops/uptime-check.yml
#
# Lives in a small PUBLIC repository (for example adrielpartners/ap-uptime) containing only
# this workflow and urls.txt. Public repositories get free GitHub Actions minutes; a private
# repository would use up the monthly allowance, because every run is billed as at least a minute.
# urls.txt holds public health URLs only (one per line, # for comments). Never put secrets here.
#
# When a check fails, the run fails and GitHub emails a failure notice. Scheduled-workflow
# notices go to the person who last changed the schedule line below, so Phillip should make
# that change. GitHub runs schedules roughly every 5–15 minutes, not to the exact minute.
name: Uptime check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check every app
        run: |
          failed=0
          while IFS= read -r url; do
            case "$url" in ""|\#*) continue ;; esac
            if curl -fsS --max-time 15 --retry 2 --retry-delay 5 -o /dev/null "$url"; then
              echo "OK    $url"
            else
              echo "DOWN  $url"
              failed=1
            fi
          done < urls.txt
          exit $failed

  # GitHub pauses scheduled workflows in public repositories after 60 days without
  # repository activity. A weekly heartbeat commit keeps this one running.
  keepalive:
    if: github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Weekly heartbeat
        run: |
          # Mondays, during the first hour (UTC). Only the first run that day changes the file.
          if [ "$(date -u +%u%H)" = "100" ]; then
            date -u +%Y-%m-%d > .heartbeat
            git config user.name "uptime-bot"
            git config user.email "uptime-bot@users.noreply.github.com"
            git add .heartbeat
            git commit -m "Heartbeat" && git push || true
          fi
